<!DOCTYPE html>
<html>
<head>
    <title>Smart Food Waste Reducer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename= 'style.csss')}}">
</head>

<body>
    <h1>🍱 Smart Food Waste Reducer</h1>

    <form method="POST">
        <label>Total Students:</label>
        <input type="number" name="total_students" required>
        <br><br>

        <label>Students Who Ate:</label>
        <input type="number" name="students_ate" required>
        <br><br>

        <label>Wasted Food (kg):</label>
        <input type="number" step="0.1" name="wasted_food" required>
        <br><br>

        <button type="submit">Calculate</button>
    </form>

    {% if result %}
        <h2>Food Waste Summary</h2>

        <p>Remaining Meals: {{ result.remaining_meals }}</p>
        <p>Waste Percentage: {{ result.waste_percentage }}%</p>
        <p>Food Saving Score: {{ result.saving_score }}%</p>

        <h3>{{ result.message }}</h3>
    {% endif %}
</body>
</html>
